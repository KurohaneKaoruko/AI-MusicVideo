[package]
name = "world-search-you"
version = "2.0.0"
edition = "2021"
description = "world.search (you) ; — a terminal music video for Mili"

[dependencies]
crossterm = "0.28"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3"] }
rustfft = "6"
anyhow = "1"
fontdue = "0.9"
png = "0.17"

# Rust's built-in `Stdio::piped()` uses a named-pipe path that fails with
# ERROR_PIPE_BUSY on this machine's Windows build, so the ffmpeg stdin pipe is
# created explicitly with CreatePipe() on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
] }

# `codegen-units = 1` was here and made every release build single-threaded:
# one `Compiling world-search-you` step taking ~5m40s even with every dependency
# already cached, against ~2m for the same edit without it. Measured against the
# built binary it bought nothing at runtime — 775 ms/frame over 20-frame runs
# versus 717 ms with it removed, i.e. within noise and if anything slower. Dropped.
[profile.release]
opt-level = 3
lto = "thin"
