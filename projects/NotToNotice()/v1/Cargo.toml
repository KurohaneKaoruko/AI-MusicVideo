[package]
name = "not-to-notice"
version = "1.0.0"
edition = "2021"
description = "NotToNotice(); - a terminal MV for CRYMACHINA's opening theme (Enoa / CV. Hikaru Tono, music by Sakuzyo)"

[dependencies]
crossterm = "0.28"
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3"] }
rustfft = "6"
anyhow = "1"
fontdue = "0.9"
png = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
