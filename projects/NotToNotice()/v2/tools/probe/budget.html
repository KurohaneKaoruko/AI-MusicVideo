<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c = document.getElementById("c");
const gl = c.getContext("webgl2", { antialias: false, preserveDrawingBuffer: false, alpha: false });
if (!gl) window.__err = "no webgl2";

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

// tunable load: N iterations of a 3-octave value-noise field, many passes
const FS = `#version 300 es
precision highp float;
out vec4 o;
uniform float uT; uniform vec2 uR; uniform int uN;
float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
float n2(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ return 0.5*n2(p) + 0.25*n2(p*2.03) + 0.125*n2(p*4.07); }
void main(){
  vec2 uv=gl_FragCoord.xy/uR;
  vec3 col=vec3(0.);
  for(int i=0;i<512;i++){
    if(i>=uN) break;
    float fi=float(i);
    vec2 q = uv*(1.0+fi*0.01) + vec2(fi*0.13, fi*0.07) + uT*0.1;
    float v = fbm(q*3.0 + fbm(q*1.7));
    col += vec3(v*0.5, v*0.75, v) * (1.0/float(i+1));
    // a few ALU ops to make it representative of real work
    col += 0.001*vec3(sin(q.x*10.0+uT), cos(q.y*10.0+uT), sin((q.x+q.y)*8.0));
  }
  o = vec4(clamp(col,0.0,1.0),1.0);
}`;

function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(prog, "uT");
const uR = gl.getUniformLocation(prog, "uR");
const uN = gl.getUniformLocation(prog, "uN");
gl.uniform2f(uR, c.width, c.height);
gl.viewport(0, 0, c.width, c.height);

window.gpuInfo = function () {
  const e = gl.getExtension("WEBGL_debug_renderer_info");
  return { renderer: e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER) };
};

const px = new Uint8Array(4);
function drawFrame(t, n) {
  gl.uniform1f(uT, t); gl.uniform1i(uN, n);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // true sync point
}

/** measure ms/frame for a given loop-count load */
window.measure = function (loops, reps) {
  gl.uniform2f(uR, c.width, c.height);
  for (let i = 0; i < 2; i++) drawFrame(i * 0.1, loops);
  const t0 = performance.now();
  for (let i = 0; i < reps; i++) drawFrame(i * 0.1, loops);
  return (performance.now() - t0) / reps;
};

/** measure ms/frame at a reduced render resolution (upscaled later) */
window.measureAt = function (w, h, loops, reps) {
  c.width = w; c.height = h; gl.viewport(0, 0, w, h);
  const r = window.measure(loops, reps);
  c.width = 1920; c.height = 1080; gl.viewport(0, 0, 1920, 1080);
  return r;
};

/** measure the cost of a full 1080p fullscreen blit (the floor for a pass) */
window.measureBlit = function (reps) { return window.measure(0, reps); };
window.__ready = true;
</script>
</body>
</html>
