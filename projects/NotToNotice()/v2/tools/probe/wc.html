<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script>
const W = 1920, H = 1080;
const c = document.getElementById("c");
c.width = W; c.height = H;
const gl = c.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true, alpha: false });
if (!gl) window.__err = "no webgl2";

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const FS = `#version 300 es
precision highp float;
out vec4 o; uniform float uT; uniform vec2 uR;
float h(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
float n(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
float map(vec3 p){ float d=1e9;
  for(int i=0;i<9;i++){ float fi=float(i);
    vec3 q=p-vec3(sin(uT*0.3+fi)*1.6, cos(uT*0.21+fi*1.7)*1.1, -fi*2.2+4.0);
    d=min(d, length(max(abs(q)-vec3(.7),0.)) + 0.18*n(q*2.0+uT*0.5)); }
  return d; }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uR)/uR.y;
  vec3 ro=vec3(0.,0.,sin(uT)*2.), rd=normalize(vec3(uv,-1.4));
  float t=0.0; vec3 col=vec3(0.);
  for(int i=0;i<56;i++){
    vec3 p=ro+rd*t; float d=map(p);
    col += exp(-d*3.2)*vec3(0.15,0.45,1.0)/float(i+1)*2.4;
    if(d<0.002) break; t+=d*0.85; if(t>26.) break;
  }
  col += 0.045*n(rd*40.+uT);
  col = col/(col+0.8);
  o=vec4(pow(col,vec3(0.4545)),1.);
}`;
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
  if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(prog, "uT"), uR = gl.getUniformLocation(prog, "uR");
gl.uniform2f(uR, W, H); gl.viewport(0, 0, W, H);

window.renderAt = (t) => { gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3); };

window.codecSupport = async function (codecs) {
  const out = [];
  for (const codec of codecs) {
    for (const hw of ["prefer-hardware", "prefer-software", "no-preference"]) {
      try {
        const s = await VideoEncoder.isConfigSupported({
          codec, width: W, height: H, framerate: 60, bitrate: 24000000,
          hardwareAcceleration: hw, avc: { format: "annexb" }, latencyMode: "quality",
        });
        out.push({ codec, hw, supported: !!s.supported });
      } catch (e) { out.push({ codec, hw, supported: false, err: String(e).slice(0, 80) }); }
    }
  }
  return out;
};

/** render+encode `count` frames starting at `start`, return chunk stats */
window.encodeProbe = async function (start, count, codec, hw) {
  const chunks = [];
  let meta = null;
  const enc = new VideoEncoder({
    output: (chunk, m) => {
      meta = m;
      const b = new Uint8Array(chunk.byteLength);
      chunk.copyTo(b);
      chunks.push({ t: chunk.timestamp, type: chunk.type, bytes: b.length });
    },
    error: (e) => { window.__encErr = String(e); },
  });
  enc.configure({
    codec, width: W, height: H, framerate: 60, bitrate: 24000000,
    hardwareAcceleration: hw, avc: { format: "annexb" }, latencyMode: "quality",
    keyFrameInterval: 120,
  });
  const t0 = performance.now();
  let queued = 0, firstError = null;
  for (let i = 0; i < count; i++) {
    renderAt((start + i) / 60);
    const frame = new VideoFrame(c, { timestamp: Math.round((start + i) * 1e6 / 60) });
    try { enc.encode(frame, { keyFrame: i % 60 === 0 }); queued++; }
    catch (e) { firstError = firstError || String(e); }
    frame.close();
    // keep the queue shallow
    if (enc.encodeQueueSize > 12) await new Promise((r) => setTimeout(r, 0));
  }
  await enc.flush();
  const ms = performance.now() - t0;
  enc.close();
  return {
    ms, perFrame: ms / count, queued, firstError,
    chunks: chunks.length,
    keyframes: chunks.filter((c) => c.type === "key").length,
    totalBytes: chunks.reduce((a, c) => a + c.bytes, 0),
    firstTs: chunks[0]?.t, lastTs: chunks[chunks.length - 1]?.t,
    avgBytes: Math.round(chunks.reduce((a, c) => a + c.bytes, 0) / Math.max(chunks.length, 1)),
    decConfig: meta?.decoderConfig ? { codec: meta.decoderConfig.codec, w: meta.decoderConfig.codedWidth, h: meta.decoderConfig.codedHeight } : null,
  };
};

/** render+encode count frames and return the raw Annex-B stream as base64 */
window.encodeToStream = async function (start, count, codec, hw) {
  const parts = [];
  const enc = new VideoEncoder({
    output: (chunk) => {
      const b = new Uint8Array(chunk.byteLength);
      chunk.copyTo(b);
      parts.push(b);
    },
    error: (e) => { window.__encErr = String(e); },
  });
  enc.configure({
    codec, width: W, height: H, framerate: 60, bitrate: 24000000,
    hardwareAcceleration: hw, avc: { format: "annexb" }, latencyMode: "quality",
    keyFrameInterval: 120,
  });
  for (let i = 0; i < count; i++) {
    renderAt((start + i) / 60);
    const frame = new VideoFrame(c, { timestamp: Math.round((start + i) * 1e6 / 60) });
    enc.encode(frame, { keyFrame: i === 0 });
    frame.close();
    if (enc.encodeQueueSize > 12) await new Promise((r) => setTimeout(r, 0));
  }
  await enc.flush();
  enc.close();
  let total = 0; for (const p of parts) total += p.length;
  const all = new Uint8Array(total);
  let o = 0; for (const p of parts) { all.set(p, o); o += p.length; }
  let s = ""; const CH = 0x8000;
  for (let i = 0; i < all.length; i += CH) s += String.fromCharCode.apply(null, all.subarray(i, i + CH));
  return btoa(s);
};
window.__ready = true;
</script>
</body>
</html>
