<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c = document.getElementById("c");
const gl = c.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true, powerPreference: "high-performance" });
if (!gl) { window.__err = "no webgl2"; }

const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

// deliberately heavy: 56-step raymarch + two octaves of noise per step
const FS = `#version 300 es
precision highp float;
out vec4 o;
uniform float uT; uniform vec2 uR;
float h(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
float n(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z); }
float map(vec3 p){ float d=1e9;
  for(int i=0;i<9;i++){ float fi=float(i);
    vec3 q=p-vec3(sin(uT*0.3+fi)*1.6, cos(uT*0.21+fi*1.7)*1.1, -fi*2.2+4.0);
    d=min(d, length(max(abs(q)-vec3(.7),0.)) + 0.18*n(q*2.0+uT*0.5)); }
  return d; }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uR)/uR.y;
  vec3 ro=vec3(0.,0.,0.), rd=normalize(vec3(uv,-1.4));
  float t=0.0; vec3 col=vec3(0.);
  for(int i=0;i<56;i++){
    vec3 p=ro+rd*t; float d=map(p);
    col += exp(-d*3.2)*vec3(0.15,0.45,1.0)/float(i+1)*2.4;
    if(d<0.002) break; t+=d*0.85; if(t>26.) break;
  }
  col += 0.045*n(rd*40.+uT);
  o=vec4(col,1.);
}`;

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uT = gl.getUniformLocation(prog, "uT"), uR = gl.getUniformLocation(prog, "uR");
gl.uniform2f(uR, c.width, c.height);
gl.viewport(0, 0, c.width, c.height);

window.gpuInfo = function () {
  const ext = gl.getExtension("WEBGL_debug_renderer_info");
  return {
    vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR),
    renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
    version: gl.getParameter(gl.VERSION),
    maxTex: gl.getParameter(gl.MAX_TEXTURE_SIZE),
  };
};

window.renderAt = function (t) { gl.uniform1f(uT, t); gl.drawArrays(gl.TRIANGLES, 0, 3); };

window.probe = function (n = 60) {
  for (let i = 0; i < 10; i++) { window.renderAt(i * 0.01); }
  gl.finish();
  const t0 = performance.now();
  for (let i = 0; i < n; i++) window.renderAt(i * 0.01);
  gl.finish();
  return (performance.now() - t0) / n;
};

// simple additive bloom chain to time the whole post stack
const fbo = [], tex = [];
const TEXW = [960, 480, 240];
for (let i = 0; i < 3; i++) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, TEXW[i], Math.round(TEXW[i] * 9 / 16), 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  fbo.push(f); tex.push(t);
}
gl.bindFramebuffer(gl.FRAMEBUFFER, null);
window.__ready = true;
</script>
</body>
</html>
